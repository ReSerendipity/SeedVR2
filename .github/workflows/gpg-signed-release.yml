# SeedVR2 Release 工作流 — GPG 签名 + SHA256SUMS
#
# 在 GitHub Release 发布时自动生成 SHA256SUMS 文件并用 GPG 签名，
# 防止供应链投毒 (CWE-912)。
#
# 使用前提:
#   1. 在 GitHub Repository Settings > Secrets and variables > Actions 中配置:
#      - GPG_PRIVATE_KEY: GPG 私钥 (gpg --export-secret-keys --armor KEY_ID)
#      - GPG_PASSPHRASE: GPG 私钥密码
#      - GPG_KEY_ID: GPG 密钥 ID (可选，自动从私钥提取)
#   2. 创建 tag: git tag -s v1.0.0  (使用 -s 签名 tag)
#   3. 推送 tag: git push origin v1.0.0
#
# 用户验证方式:
#   gpg --verify SHA256SUMS.gpg SHA256SUMS
#   sha256sum -c SHA256SUMS

name: GPG-Signed Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  sign-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --dearmor --import
          echo "default-cache-ttl=3600" > ~/.gnupg/gpg-agent.conf
          echo "allow-preset-passphrase" >> ~/.gnupg/gpg-agent.conf
          gpg-connect-agent reloadagent /bye
          echo "${{ secrets.GPG_PASSPHRASE }}" | gpg --batch --yes --passphrase-fd 0 --pinentry-mode loopback -ab /dev/null 2>/dev/null || true

      - name: Download release assets
        id: download
        run: |
          mkdir -p release-assets
          gh release download ${{ github.event.release.tag_name }} --dir release-assets --clobber
          echo "asset_count=$(ls release-assets | wc -l)" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Generate SHA256SUMS
        id: sha256
        run: |
          cd release-assets
          sha256sum * > ../SHA256SUMS
          cat ../SHA256SUMS
          echo "sha256_content=$(cat ../SHA256SUMS)" >> $GITHUB_OUTPUT

      - name: GPG sign SHA256SUMS
        run: |
          gpg --batch --yes --passphrase-fd 0 --pinentry-mode loopback \
            --local-user ${{ secrets.GPG_KEY_ID }} \
            --output SHA256SUMS.gpg \
            --detach-sign SHA256SUMS <<< "${{ secrets.GPG_PASSPHRASE }}"
          echo "GPG signature created:"
          gpg --verify SHA256SUMS.gpg SHA256SUMS

      - name: Upload SHA256SUMS and signature
        run: |
          gh release upload ${{ github.event.release.tag_name }} \
            SHA256SUMS SHA256SUMS.gpg --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update release body with verification instructions
        run: |
          cat > verification_note.md << 'EOF'
          
          ---
          
          ## 🔐 完整性验证
          
          下载 `SHA256SUMS` 和 `SHA256SUMS.gpg` 后执行:
          
          ```bash
          # 1. 导入 GPG 公钥 (首次)
          gpg --keyserver keyserver.ubuntu.com --recv-keys ${{ secrets.GPG_KEY_ID }}
          
          # 2. 验证签名
          gpg --verify SHA256SUMS.gpg SHA256SUMS
          
          # 3. 验证文件哈希
          sha256sum -c SHA256SUMS
          ```
          EOF
          
          gh release edit ${{ github.event.release.tag_name }} \
            --notes-file <(cat <(gh release view ${{ github.event.release.tag_name }} --json body -q .body) verification_note.md)
        env:
          GH_TOKEN: ${{ github.token }}
