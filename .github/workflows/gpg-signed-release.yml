# SeedVR2 Release 工作流 — GPG 签名 + SHA256SUMS
#
# 在 GitHub Release 发布时自动生成 SHA256SUMS 文件并用 GPG 签名，
# 防止供应链投毒 (CWE-912)。
#
# 触发方式:
#   - release: published（自动，仅当 Release 由非 GITHUB_TOKEN 创建时才会触发；
#     由 Actions 内 gh release create 创建的 Release 不会触发本事件）
#   - workflow_dispatch（手动，输入要签名的 tag；留空则取最新 Release）
#
# 使用前提（仓库 Settings > Secrets and variables > Actions）:
#   - GPG_PRIVATE_KEY: GPG 私钥 (gpg --export-secret-keys --armor KEY_ID)
#   - GPG_PASSPHRASE: GPG 私钥密码
#   - GPG_KEY_ID: GPG 密钥 ID（可选，自动从私钥提取）
# 未配置 GPG secrets 时本工作流仍会生成并上传 SHA256SUMS，只是跳过签名。
#
# 用户验证方式:
#   gpg --verify SHA256SUMS.gpg SHA256SUMS
#   sha256sum -c SHA256SUMS

name: GPG-Signed Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要签名的 Release tag（留空取最新 Release）"
        required: false
        default: ""
  release:
    types: [published]

permissions:
  contents: write

jobs:
  sign-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag
        id: tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="${{ inputs.tag }}"
          fi
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Signing release: $TAG"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Import GPG key
        if: env.GPG_PRIVATE_KEY != ''
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --dearmor --import
          echo "default-cache-ttl=3600" > ~/.gnupg/gpg-agent.conf
          echo "allow-preset-passphrase" >> ~/.gnupg/gpg-agent.conf
          gpg-connect-agent reloadagent /bye
          echo "${{ secrets.GPG_PASSPHRASE }}" | gpg --batch --yes --passphrase-fd 0 --pinentry-mode loopback -ab /dev/null 2>/dev/null || true

      - name: Download release assets
        id: download
        run: |
          mkdir -p release-assets
          gh release download "${{ steps.tag.outputs.tag }}" --dir release-assets --clobber
          echo "asset_count=$(ls release-assets | wc -l)" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Generate SHA256SUMS
        id: sha256
        if: steps.download.outputs.asset_count != '0'
        run: |
          cd release-assets
          sha256sum * > ../SHA256SUMS
          cat ../SHA256SUMS
          # 注意：GITHUB_OUTPUT 不支持多行值，只输出单行布尔标记
          echo "ok=true" >> $GITHUB_OUTPUT

      - name: GPG sign SHA256SUMS
        if: steps.sha256.outputs.ok == 'true' && env.GPG_PRIVATE_KEY != ''
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          gpg --batch --yes --passphrase-fd 0 --pinentry-mode loopback \
            --local-user "${{ secrets.GPG_KEY_ID }}" \
            --output SHA256SUMS.gpg \
            --detach-sign SHA256SUMS <<< "${{ secrets.GPG_PASSPHRASE }}"
          echo "GPG signature created:"
          gpg --verify SHA256SUMS.gpg SHA256SUMS

      - name: Upload SHA256SUMS and signature
        if: steps.sha256.outputs.ok == 'true'
        run: |
          if [ -f SHA256SUMS.gpg ]; then
            gh release upload "${{ steps.tag.outputs.tag }}" SHA256SUMS SHA256SUMS.gpg --clobber
          else
            gh release upload "${{ steps.tag.outputs.tag }}" SHA256SUMS --clobber
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update release body with verification instructions
        if: steps.sha256.outputs.ok == 'true'
        run: |
          cat > verification_note.md << 'EOF'

          ---

          ## 🔐 完整性验证

          下载 `SHA256SUMS` 后执行:

          ```bash
          # 1. 校验文件哈希
          sha256sum -c SHA256SUMS
          ```

          ```bash
          # 2.（可选）GPG 校验签名——先导入 GPG 公钥（首次）
          gpg --keyserver keyserver.ubuntu.com --recv-keys ${{ secrets.GPG_KEY_ID }}

          # 3. 验证签名（若已提供 SHA256SUMS.gpg）
          gpg --verify SHA256SUMS.gpg SHA256SUMS
          ```
          EOF

          gh release edit "${{ steps.tag.outputs.tag }}" \
            --notes-file <(cat <(gh release view "${{ steps.tag.outputs.tag }}" --json body -q .body) verification_note.md)
        env:
          GH_TOKEN: ${{ github.token }}
