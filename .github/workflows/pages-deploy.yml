name: Deploy Demo & Docs to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'demo/**'
      - 'website/**'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build docs site (VitePress)
        working-directory: website
        run: |
          npm ci
          npm run build
          # 把文档站构建产物放入 demo/docs/，与 demo 一并部署到
          # https://<owner>.github.io/<repo>/docs/
          mkdir -p ../demo/docs
          cp -r docs/.vitepress/dist/* ../demo/docs/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
