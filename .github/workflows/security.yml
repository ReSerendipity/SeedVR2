name: Security Scan (SAST)

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'  # 每周一凌晨 4 点

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep Scan
        run: |
          python -m pip install --upgrade semgrep
          semgrep ci --config auto --sarif --output semgrep.sarif || true

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif

  # 密钥泄露扫描 — 学习 Image_MultiModel 的 Trivy FS 模式
  # 扫描仓库历史中的密钥/Token 泄露，防止凭据意外提交。
  secret-scan:
    name: Secret Scanning (Trivy FS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy secret scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          scanners: 'secret'
          scan-ref: '.'
