name: Security Scan (SAST)

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'  # 每周一凌晨 4 点

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: "Semgrep Scan (blocking gate: ERROR only)"
        # semgrep 1.173.0 的 `semgrep ci` 无 --severity 选项且 OSS 模式下任何告警均视为
        # blocking；故用 `semgrep scan --severity ERROR --error` 实现"真实 ERROR 阻断、
        # WARNING/MEDIUM 不阻断"；# nosemgrep 标注的误报不阻断（下方 SARIF 中仍以上报）。
        run: |
          python -m pip install semgrep==1.173.0
          semgrep scan --config auto --severity ERROR --error

      - name: Semgrep SARIF (report-only, all severities)
        # 全量告警（含 WARNING/MEDIUM 与 nosemgrep 抑制项）进 SARIF 上报，不参与门禁。
        # || true 仅作用于报告步骤：semgrep 自身故障由上方 gate 步骤暴露，不再被静默。
        if: always()
        run: |
          semgrep scan --config auto --sarif --output semgrep.sarif || true

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif

  # 密钥泄露扫描 — 学习 Image_MultiModel 的 Trivy FS 模式
  # 扫描仓库历史中的密钥/Token 泄露，防止凭据意外提交。
  secret-scan:
    name: Secret Scanning (Trivy FS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy secret scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0 (2026-04-22 官方攻击响应后最新稳定版; SHA pin 防 tag 强更)
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          scanners: 'secret'
          scan-ref: '.'
