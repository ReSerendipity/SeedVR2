# .github/workflows/desktop-release.yml
# 桌面发行：构建启动器（PyInstaller）→ 预装小依赖 → 编译安装包（ISCC）→ 上传。
# 触发方式：
#   - workflow_dispatch：手动验证构建（不上传 Release，只留 workflow artifact）
#   - push tag v*：构建并上传安装包到对应 Release（GPG 签名由 gpg-signed-release.yml
#     在 release published 时自动完成，本工作流不重复签名）
name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载便携 WinPython 3.12.10.1（GitHub Release 资产）
        shell: powershell
        run: |
          $url = "https://github.com/winpython/winpython/releases/download/16.5.20250614/Winpython64-3.12.10.1dotb4.exe"
          $ok = $false
          foreach ($i in 1..3) {
            try {
              Invoke-WebRequest -Uri $url -OutFile WPy.exe -UseBasicParsing -TimeoutSec 300
              $ok = $true
              break
            } catch {
              Write-Output "download attempt $i failed: $($_.Exception.Message)"
              Start-Sleep -Seconds 5
            }
          }
          if (-not $ok) { throw "WinPython download failed after 3 attempts" }
          Write-Output "downloaded WPy.exe size: $((Get-Item WPy.exe).Length)"

      - name: 解压 WinPython 到 WPy64-312101
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path WPy64-312101 -Force | Out-Null
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) { throw "7-Zip not found on runner" }
          & $sevenZip x WPy.exe "-oWPy64-312101" -y | Out-Null
          $py = Get-ChildItem WPy64-312101 -Recurse -Filter python.exe | Select-Object -First 1
          if (-not $py) { throw "python.exe not found after extraction" }
          Write-Output "PYTHON=$($py.FullName)"
          Write-Output "PYVER=$(& $py.FullName --version)"

      - name: 预装小依赖（torch 家族除外，torch 由启动器首启安装）
        shell: powershell
        run: |
          $py = Get-ChildItem WPy64-312101 -Recurse -Filter python.exe | Select-Object -First 1
          & $py.FullName -m pip install --upgrade pip
          & $py.FullName -m pip install -r launcher\requirements-small.txt --timeout 300 --retries 3

      - name: 构建启动器（PyInstaller，含静态资源）
        shell: powershell
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --noconfirm --onefile --windowed --name SeedVR2 --paths . --add-data "launcher\static;launcher\static" launcher\launcher_main.py
          Get-Item dist\SeedVR2.exe | Select-Object Name, Length

      - name: 编译安装包（ISCC）
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" -OutFile is.exe
          .\is.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" launcher\installer.iss
          Get-ChildItem dist\SeedVR2-Setup-*.exe | Select-Object Name, Length

      - name: 生成 SHA256SUMS
        shell: powershell
        run: |
          Get-ChildItem dist\SeedVR2-Setup-*.exe | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))"
          } | Set-Content dist\SHA256SUMS -Encoding ascii

      - name: 上传安装包为 workflow artifact（验证构建）
        uses: actions/upload-artifact@v4
        with:
          name: SeedVR2-Setup
          path: |
            dist/SeedVR2-Setup-*.exe
            dist/SHA256SUMS

      - name: 打 tag 时上传到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $exe = Get-ChildItem dist\SeedVR2-Setup-*.exe | Select-Object -First 1
          # release-please 可能已创建 Release，已存在则忽略
          gh release create $tag --title "$tag" --generate-notes 2>$null
          gh release upload $tag "$($exe.FullName)" dist\SHA256SUMS --clobber
