name: Bug Report
description: 报告一个 Bug 以帮助我们改进 SeedVR2
title: "[BUG] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢您报告 Bug！请尽可能详细地填写以下信息，以帮助我们快速定位问题。

  - type: textarea
    id: description
    attributes:
      label: Bug 描述
      description: 清晰描述什么是 Bug，以及您预期会发生什么。
      placeholder: |
        ## 现象
        ...

        ## 预期行为
        ...

        ## 实际行为
        ...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 提供最小化复现步骤。
      placeholder: |
        1. 打开 SeedVR2 Web UI
        2. 上传文件 ...
        3. 点击修复
        4. 看到 error ...
    validations:
      required: true

  - type: dropdown
    id: task_type
    attributes:
      label: 任务类型
      description: 您遇到 Bug 时的任务类型是什么？
      options:
        - 图像修复 (单文件)
        - 视频修复 (单文件)
        - 批量修复 (文件夹)
        - 模型加载/卸载/切换
        - 系统设置
        - 历史记录
        - SSE 进度推送
        - 其他
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: 使用的模型
      description: 模型尺寸和精度，如 3B FP16、7B FP8 等。
      placeholder: "3B FP16"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 请提供完整的环境信息以便排查。
      placeholder: |
        - 操作系统: Windows 11 / Ubuntu 22.04 / macOS 14
        - GPU 型号: RTX 4090
        - 显存: 24 GB
        - Python 版本: 3.12.4
        - CUDA 版本: 12.4
        - PyTorch 版本: 2.4.0+cu124
        - SeedVR2 版本: v1.0.0
        - 浏览器: Chrome 126
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志输出
      description: 相关的日志或控制台输出（如有）。请使用 ``` 代码块包裹。
      render: shell
      placeholder: |
        [2026-08-10 10:00:00] [ERROR] bin.integrated_app.routes.restore.upload: ...
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: 截图
      description: 如有截图或错误界面，请拖拽到此处。
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 确认事项
      description: 提交前请确认以下事项。
      options:
        - label: 我已搜索现有 Issue，确认这不是重复报告
          required: true
        - label: 我已尝试使用最新版本，问题仍然存在
          required: true
        - label: 我已查看 README 和文档，未找到解决方案
          required: true
